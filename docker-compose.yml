version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: oz_dokonim_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oz_dokonim_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oz_dokonim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: oz_dokonim_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oz_dokonim_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_2026}@postgres:5432/${POSTGRES_DB:-oz_dokonim_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_2026}@postgres:5432/${POSTGRES_DB:-oz_dokonim_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super_secret_jwt_key_uzbekistan_2026}
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  # 4. React Frontend (Web & POS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: oz_dokonim_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 5. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: oz_dokonim_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
